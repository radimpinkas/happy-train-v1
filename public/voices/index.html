<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Train – Complete Google AI Studio Voice Pack (WAV Files)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --green: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px 60px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
      color: var(--gold);
    }
    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .btn-all {
      background: var(--gold);
      color: #0f172a;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn-all:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }
    .group {
      margin-bottom: 32px;
    }
    .group-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .group-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
      color: var(--accent);
    }
    .group-meta {
      font-size: 0.85rem;
      color: var(--muted);
      background: rgba(255,255,255,0.05);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .clip-list {
      display: grid;
      gap: 12px;
    }
    .clip-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .clip-info {
      flex: 1 1 280px;
    }
    .filename {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 4px;
    }
    .line-text {
      font-size: 1.02rem;
      color: var(--text);
      margin: 0;
    }
    .clip-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    audio {
      height: 38px;
      width: 240px;
    }
    .dl-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .dl-link:hover {
      background: rgba(56, 189, 248, 0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Happy Train – Google AI Studio Voice Pack (WAV Files)</h1>
        <p class="subtitle">24 kHz, 16-bit mono RIFF WAV files generated via Google AI Studio (Aoede, Gacrux, Achird, Callirrhoe, Achernar, Sulafat, Zephyr, Leda, Puck)</p>
      </div>
      <button class="btn-all" id="downloadAllBtn">Download All WAV Files</button>
    </header>

    <div id="groups-root"></div>
  </div>

  <script>
    var voiceGroups = [
      {
        title: '1. Rabbit & Cars (Aoede)',
        meta: 'Voice: Aoede • Style: Vocal Smile • Pace: Rapid Fire • Accent: Neutral',
        clips: [
          { file: 'rabbit-hello.wav', text: 'Hop, hop, hello Train Dan! Look how high I can jump!' },
          { file: 'car-hello.wav', text: 'Beep, beep! Hi Train Dan! We are waving at you from the crossing!' }
        ]
      },
      {
        title: '2. Owl & Grandma (Gacrux)',
        meta: 'Voice: Gacrux • Style: Empathetic • Pace: Staccato • Accent: Neutral',
        clips: [
          { file: 'owl-hello.wav', text: 'Hoo-hoo! Hello Train Dan! Wise owl is waving from the tree branch!' },
          { file: 'grandma-hello.wav', text: 'Hello darling Dan! Grandma is waving to you from our yellow house!' }
        ]
      },
      {
        title: '3. Dad & Grandpa (Achird)',
        meta: 'Voice: Achird • Style: Empathetic • Pace: Rapid Fire • Accent: Neutral',
        clips: [
          { file: 'dad-hello.wav', text: 'Hey buddy Dan! Dad is waving to you by the swimming pool! Have a great ride!' },
          { file: 'grandpa-hello.wav', text: 'Hello little driver Dan! Grandpa is cheering for your train from the garden!' }
        ]
      },
      {
        title: '4. Squirrel & AI Trains (Callirrhoe)',
        meta: 'Voice: Callirrhoe • Style: Empathetic • Pace: Staccato • Accent: Neutral',
        clips: [
          { file: 'squirrel-hello.wav', text: 'Wheee! Hi Train Dan! Watch me spin and jump up onto the tree branch!' },
          { file: 'aitrain-hello.wav', text: 'Toot, toot! Hello friend Dan! Passing you safely on the second track!' },
          { file: 'aitrain-yield.wav', text: 'Choo, choo! After you, friend Dan! You have the right of way!' }
        ]
      },
      {
        title: '5. Mom & Mom Narrator (Achernar)',
        meta: 'Voice: Achernar • Style: Empathetic • Pace: Natural • Accent: Neutral',
        clips: [
          { file: 'mom-house-hello.wav', text: 'Hello sweetie! Mommy is waving to you from our house and garden!' },
          { file: 'mom-night.wav', text: 'Good evening! Night is falling and all the lights are glowing brightly!' },
          { file: 'mom-anantara.wav', text: 'Now you are heading to the beautiful Anantara Hotel by the river in Bangkok!' },
          { file: 'mom-iconsiam.wav', text: 'Look, now we are riding past IconSiam and the dancing fountains in Bangkok!' },
          { file: 'storyteller-hello.wav', text: 'Hello, little explorer! Are you ready for an adventure?' },
          { file: 'storyteller-discovery.wav', text: 'Look ahead. A magical world is waiting for us.' },
          { file: 'storyteller-praise.wav', text: 'Wonderful! You found something new.' },
          { file: 'storyteller-turn-left.wav', text: "Let's turn left and see where the tracks take us." },
          { file: 'storyteller-turn-right.wav', text: "Let's turn right toward a new adventure." },
          { file: 'storyteller-go-straight.wav', text: 'Going straight ahead along the railway line.' },
          { file: 'storyteller-station.wav', text: 'Here we are at the station! Watch the happy passengers step aboard our train.' },
          { file: 'storyteller-sheep.wav', text: "Oh look, fluffy white sheep are on the track! Let's honk gently so they step onto the grass." },
          { file: 'storyteller-sunny.wav', text: 'The sun is shining brightly over our fairytale world!' }
        ]
      },
      {
        title: '6. Little Train Daníček (Sulafat)',
        meta: 'Voice: Sulafat • Style: Vocal Smile • Pace: Natural • Accent: Neutral',
        clips: [
          { file: 'danicek-ready.wav', text: "Hi, buddy! I'm ready to explore!" },
          { file: 'danicek-crystals.wav', text: 'Wow! Look at those beautiful crystals!' },
          { file: 'danicek-next-stop.wav', text: 'Where shall we go next?' },
          { file: 'danicek-speed-up.wav', text: 'Chugga chugga! Going faster! Choo choo!' },
          { file: 'danicek-slow-down.wav', text: 'Slowing down! Easy and steady!' },
          { file: 'danicek-reverse.wav', text: 'Backing up! Beep beep, watch out behind me!' },
          { file: 'danicek-tunnel.wav', text: 'Whoosh! Entering the dark tunnel! Turning on my bright headlight!' },
          { file: 'danicek-metro.wav', text: 'Hooray! Into the underground metro tunnel we go! Look at the gnomes and waterfalls!' },
          { file: 'danicek-eiffel.wav', text: 'Look! That is the tall Eiffel Tower!' },
          { file: 'danicek-colosseum.wav', text: 'Look! There is the Roman Colosseum!' },
          { file: 'danicek-airport.wav', text: 'Look at the airplanes at the Airport!' },
          { file: 'danicek-jewel.wav', text: 'Wow, look at the big waterfall inside Jewel!' },
          { file: 'danicek-stadium.wav', text: 'Look! They are playing football in the Stadium!' },
          { file: 'danicek-bigben.wav', text: 'Look at Big Ben, the golden clock tower!' },
          { file: 'danicek-skyscraper.wav', text: 'Wow, look at that tall glass Skyscraper!' },
          { file: 'danicek-fountain.wav', text: 'Look at the sparkling water Fountain!' },
          { file: 'danicek-boat.wav', text: 'Look at the wooden Anantara boat on the river!' },
          { file: 'danicek-landmarks.wav', text: 'Wow, look at that amazing landmark right next to our tracks!' }
        ]
      },
      {
        title: '7. Charlie the Helicopter (Zephyr)',
        meta: 'Voice: Zephyr • Style: Promo/Hype • Pace: Rapid Fire • Accent: Neutral',
        clips: [
          { file: 'charlie-takeoff.wav', text: 'Hey, adventurers! Charlie is ready for takeoff!' },
          { file: 'charlie-overview.wav', text: 'I can see something interesting from up here!' },
          { file: 'charlie-explore.wav', text: "Come on, team! Let's take a closer look!" }
        ]
      },
      {
        title: '8. Cow & Sheep (Leda) + Track Monsters (Puck)',
        meta: 'Voice: Leda (Vocal Smile) & Puck (Promo/Hype, Staccato)',
        clips: [
          { file: 'cow-hello.wav', text: 'Mooo! Hello Train Dan! Daisy the cow wishes you a happy journey!' },
          { file: 'sheep-hello.wav', text: 'Baa, baa! Hi Train Dan! The fluffy white sheep are waving to you!' },
          { file: 'monster-help.wav', text: 'Oh no, here comes the train! Help! Let us hide behind the tree!' },
          { file: 'monster-bleh.wav', text: 'Peek-a-boo, Train Dan! Bleh, bleh, you cannot catch me!' }
        ]
      }
    ];

    var allFiles = [];
    var root = document.getElementById('groups-root');
    voiceGroups.forEach(function (grp) {
      var sec = document.createElement('section');
      sec.className = 'group';
      sec.innerHTML =
        '<div class="group-header">' +
          '<h2 class="group-title">' + grp.title + '</h2>' +
          '<span class="group-meta">' + grp.meta + '</span>' +
        '</div>';
      var list = document.createElement('div');
      list.className = 'clip-list';
      grp.clips.forEach(function (item) {
        allFiles.push(item.file);
        var card = document.createElement('div');
        card.className = 'clip-card';
        card.innerHTML =
          '<div class="clip-info">' +
            '<div class="filename">' + item.file + '</div>' +
            '<p class="line-text">"' + item.text + '"</p>' +
          '</div>' +
          '<div class="clip-actions">' +
            '<audio controls preload="metadata" src="/voices/' + item.file + '"></audio>' +
            '<a class="dl-link" href="/voices/' + item.file + '" download="' + item.file + '">Download WAV</a>' +
          '</div>';
        list.appendChild(card);
      });
      sec.appendChild(list);
      root.appendChild(sec);
    });

    document.getElementById('downloadAllBtn').addEventListener('click', function () {
      allFiles.forEach(function (file, idx) {
        setTimeout(function () {
          var a = document.createElement('a');
          a.href = '/voices/' + file;
          a.download = file;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, idx * 350);
      });
    });
  </script>
</body>
</html>
